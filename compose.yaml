services:
  db:
    image: postgres:18
    environment:
      POSTGRES_USER: scout
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-scout_local_only}
      POSTGRES_DB: scout
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U scout -d scout"]
      interval: 3s
      timeout: 3s
      retries: 20
  scout:
    build: .
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://scout:scout_local_only@db:5432/scout}
      MODE: ${MODE:-off}
      TELEGRAM_TOKEN: ${TELEGRAM_TOKEN:-}
      ALLOWED_CHAT_IDS: ${ALLOWED_CHAT_IDS:-}
      WEBHOOK_URL: ${WEBHOOK_URL:-}
      WEBHOOK_SECRET: ${WEBHOOK_SECRET:-}
      PTB_TIMEDELTA: "1"
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
volumes:
  pgdata:
